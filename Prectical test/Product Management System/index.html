<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Product Management System </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <caption> Product Management System </caption>

        <thead>
            <tr>
                <td>ID</td>
                <td>IMAGE</td>
                <td>PRODUCT NAME</td>
                <td>DESCRIPTION</td>
                <td>PRICE</td>
                <td>CATEGORY</td>
                <td>ACTION</td>
            </tr>
        </thead>
        <tbody id="my-product"></tbody>
    </table>

    <div>
        <input type="text" placeholder="Enter Name" id="name">
        <input type="text" placeholder="Enter ProductName" id="productName">
        <input type="text" placeholder="Enter Description" id="description">
        <input type="number" placeholder="Enter Price" id="price">
        <input type="text" placeholder="Enter Category" id="category">
        <input type="text" placeholder="Enter Image url" id="image">
        <button onclick="add() " id="btn">Add Product</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
